displayName: "Cloud Run 5xx rate > 1%"
documentation:
  content: |
    jquants is returning 5xx responses at >1% over 10 minutes.
    Check logs for the top error, recent deploys, and Firestore / J-Quants
    API availability.

    502 is excluded on purpose. With min-instances=0 a cold start spends ~17s
    downloading cache.db before the gateway can accept a connection, and the
    oauth2-proxy sidecar answers 502 for that whole window. That is the
    designed behaviour of scale-to-zero — the download is what keeps the cache
    fresh (#584) — so paging on it means paging on the service working as
    intended. It fired exactly that way on 2026-08-13: three CD smoke-test
    requests hit a cold instance and produced a 75% ratio out of a handful of
    requests.

    The trade-off is that a genuine upstream failure (the app container
    crash-looping, so the sidecar 502s indefinitely) no longer trips this
    policy. That case is covered by `03-oom-kill` and by the container
    restarting, and it fails differently: 502s that never stop rather than a
    burst that clears in seconds.

    Sensitivity caveat: the condition still needs the ratio to hold for 600s,
    and with min-instances=0 request_count is gappy — an idle stretch drops
    the joined series, so a real fault on a lightly-used service may not
    sustain long enough to fire. Threshold and duration were derived from the
    load tests in #72/#73, before scale-to-zero. Re-tune against observed
    traffic rather than assuming this fires.

    Runbook: https://github.com/shigechika/jquants-mcp/blob/main/docs/runbooks/5xx-spike.md
  mimeType: text/markdown
combiner: OR
conditions:
  - displayName: "5xx ratio > 0.01 for 10min"
    conditionMonitoringQueryLanguage:
      query: |
        fetch cloud_run_revision
        | metric 'run.googleapis.com/request_count'
        | filter resource.service_name == 'jquants'
        | align rate(1m)
        | {
            total: group_by [], sum(val());
            errs:  filter metric.response_code_class == '5xx'
                          && metric.response_code != 502
                   | group_by [], sum(val())
          }
        | join
        | value [ratio: val(1) / val(0)]
        | condition val() > 0.01
      duration: 600s
      trigger:
        count: 1
alertStrategy:
  autoClose: 86400s
notificationChannels:
  - __CHANNEL__
severity: WARNING
