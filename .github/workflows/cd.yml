name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress CD when a newer one starts on the same branch.
# Prevents wasted Actions minutes on rapid back-to-back merges (e.g. PR
# trains, release-please rebase loops).
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      id-token: write
      packages: write

    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUDRUN_SERVICE: ${{ vars.CLOUDRUN_SERVICE }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Need the parent commit so git diff can compare HEAD~1
          # for workflow_run-triggered runs.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # Detect whether the deployable image actually depends on any file in
      # this commit. Test-only, docs-only, .claude/-only, etc. changes are
      # skipped and save ~5–7 minutes of Cloud Run build time.
      # ``git diff`` is used instead of the dorny/paths-filter action because
      # the latter rejects ``HEAD~1`` as an invalid refspec when it tries to
      # ``git fetch`` the base — we already have HEAD~1 locally thanks to
      # ``fetch-depth: 2``.
      - name: Detect deploy-relevant changes
        id: changes
        if: github.event_name == 'workflow_run'
        run: |
          set -eu
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/|Dockerfile$|pyproject\.toml$|uv\.lock$|scripts/|\.github/workflows/cd\.yml$|\.github/workflows/scripts/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to deploy
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Deploying because event_name=workflow_dispatch"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.changes.outputs.code }}" == "true" ]]; then
            echo "Deploying because deploy-relevant files changed"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No deploy-relevant files changed; skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - id: auth
        if: steps.gate.outputs.should_deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - if: steps.gate.outputs.should_deploy == 'true'
        uses: google-github-actions/setup-gcloud@v3

      # This service (oauth2-proxy sidecar + app, jquants-mcp#570/#585) is
      # structurally different from the single-container deploy this job used
      # to target: min-instances=0 is load-bearing (jquants-mcp#584 — cold
      # starts always download a current cache.db, so idling to zero is what
      # keeps the service correct, not just cheap) and CPU must stay
      # unthrottled while the app container's startup sync runs. Both were
      # violated by hand once already (a real billing incident, see the plan
      # doc). `gcloud run services update --container app --image` only
      # touches the app container's image — the oauth2-proxy container, env
      # vars, and secrets are left exactly as they are. Never add scaling or
      # CPU flags to this step; if a setting genuinely needs to change, do it
      # deliberately in its own reviewed step, not as a side effect of an
      # image bump.
      # Checked against fixed expected values, not a pre/post diff: a diff
      # alone would pass silently if the service was *already* misconfigured
      # before this run started (the exact incident this guard exists for —
      # an out-of-band `gcloud` change persists across every deploy that
      # merely confirms "nothing changed"). Run before the build too, so a
      # pre-existing drift fails fast instead of deploying on top of it.
      #   minScale: the annotation is absent (empty string) when scale-to-zero
      #   is in effect — Cloud Run does not write "0" explicitly.
      - name: Assert billing-relevant settings (pre-deploy)
        if: steps.gate.outputs.should_deploy == 'true'
        run: |
          .github/workflows/scripts/assert-jquants-billing-settings.sh pre-deploy

      - name: Build app image
        if: steps.gate.outputs.should_deploy == 'true'
        id: build
        run: |
          set -eu
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/cloud-run-source-deploy/jquants:${SHA}"
          # The WIF deploy SA can create builds (roles/cloudbuild.builds.editor)
          # but has no roles/logging.viewer, so plain `gcloud builds submit`
          # creates the build successfully and then fails trying to STREAM its
          # logs -- exit 1 even though the build itself succeeds (confirmed on
          # the first merge-triggered CD run: the image built and pushed, but
          # the job still failed at this step).
          #
          # --suppress-logs does NOT fix this -- confirmed by reading the
          # installed gcloud SDK source (api_lib/cloudbuild/logs.py,
          # command_lib/builds/submit_util.py): it only sets `out=None`, which
          # gates whether fetched log text gets printed. The GCSLogTailer
          # thread that performs the authenticated GCS read is still started
          # unconditionally in CloudBuildClient.Stream(), and its 403 is still
          # re-raised via `if t.exception is not None: raise t.exception`
          # regardless of `out`. (My first attempt at this fix used
          # --suppress-logs and appeared to work in local testing -- but that
          # test ran under my own Owner-level gcloud identity, not the
          # restricted WIF SA, so it never exercised the actual 403 path.)
          #
          # --async skips log streaming (and the GCSLogTailer thread)
          # entirely -- confirmed in submit_util.py: `if async_: return
          # build, op` returns before Stream() is ever called. Poll
          # `builds describe` separately instead, which only needs
          # `cloudbuild.builds.get` (already covered by
          # cloudbuild.builds.editor, and proven to work under the real WIF
          # SA: the failed run's own logs show "Waiting for build to
          # complete" -- i.e. GetBuild() polling -- succeeding before the
          # later log-tail failure).
          BUILD_ID=$(gcloud builds submit --tag "$IMAGE" --project ${{ vars.GCP_PROJECT }} --async --format='value(id)' .)
          echo "Cloud Build: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project ${{ vars.GCP_PROJECT }} --format='value(status)')
            case "$STATUS" in
              SUCCESS)
                echo "Cloud Build $BUILD_ID succeeded"
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                # The deploy SA has no roles/logging.viewer, so build step
                # output isn't fetchable here. failureInfo.detail is a Build
                # resource field (covered by the same builds.get this loop
                # already uses), not log content, but Cloud Build only
                # populates it for specific failure categories (push
                # failures, source fetch failures) -- it's commonly empty
                # for a failed build step (e.g. a broken Dockerfile RUN),
                # which is why the console link `gcloud builds submit`
                # already printed above remains the primary way to see what
                # happened.
                DETAIL=$(gcloud builds describe "$BUILD_ID" --project ${{ vars.GCP_PROJECT }} --format='value(failureInfo.detail)')
                echo "::error::Cloud Build $BUILD_ID finished with status $STATUS${DETAIL:+ ($DETAIL)}"
                exit 1
                ;;
              QUEUED|WORKING|PENDING)
                sleep 5
                ;;
              *)
                echo "::error::Cloud Build $BUILD_ID: unexpected status '$STATUS'"
                exit 1
                ;;
            esac
          done
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run (app container image only)
        if: steps.gate.outputs.should_deploy == 'true'
        run: |
          gcloud run services update ${{ vars.CLOUDRUN_SERVICE }} \
            --project ${{ vars.GCP_PROJECT }} \
            --region ${{ vars.GCP_REGION }} \
            --container app \
            --image ${{ steps.build.outputs.image }}

      - name: Assert billing-relevant settings (post-deploy)
        if: steps.gate.outputs.should_deploy == 'true'
        run: |
          .github/workflows/scripts/assert-jquants-billing-settings.sh post-deploy

      - name: Verify Cloud Run deployment
        if: steps.gate.outputs.should_deploy == 'true'
        run: |
          set -eu

          # gcloud run services update does not support --traffic; call
          # update-traffic separately. This also self-heals if Cloud Run's
          # reconciler ever pins traffic to a specific revision instead of
          # latest (observed before, see the old `gcloud run deploy` job
          # this replaced) -- without it, that state would hard-fail every
          # subsequent deploy instead of being corrected here.
          gcloud run services update-traffic ${{ vars.CLOUDRUN_SERVICE }} \
            --project ${{ vars.GCP_PROJECT }} \
            --region ${{ vars.GCP_REGION }} \
            --to-latest

          read -r TRAFFIC_MODE SERVING < <(gcloud run services describe ${{ vars.CLOUDRUN_SERVICE }} \
            --project ${{ vars.GCP_PROJECT }} \
            --region ${{ vars.GCP_REGION }} \
            --format="value(spec.traffic[0].latestRevision,status.traffic[0].revisionName)")
          if [[ "$TRAFFIC_MODE" != "True" ]]; then
            echo "::error::spec.traffic is not routed to latestRevision after deploy"
            exit 1
          fi
          echo "Traffic routing: latestRevision=true ✓"
          echo "Serving revision: $SERVING"

          # Smoke-test the MCP endpoint. oauth2-proxy skip-auths ^/mcp(/|$)
          # (mcp-stdio serve's own OAuth layer is the real gate for it), so a
          # successful response is 401, not 200.
          # Any 5xx or network failure (reported as 000) means the revision
          # is crashing. Assumes OAUTH_BASE_URL has no trailing slash.
          #
          # Retried: Cloud Run's readiness check for this revision is driven
          # by the *ingress* container's (oauth2-proxy) startup probe, not
          # the non-ingress `app` container -- so "latestReadyRevisionName"
          # (and traffic routing to it, just above) can go True while `app`
          # is still mid-startup (synchronous cache.db download, ~12s).
          # oauth2-proxy returns 502 for that window since its upstream
          # isn't listening yet. Observed live on the first successful
          # deploy through this job: traffic cut over correctly to the new
          # revision, the immediate smoke test hit a 502, and the same
          # request succeeded (401) a few minutes later with no other
          # change -- confirming this is a transient cold-start race, not an
          # unhealthy revision.
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5
          HTTP_STATUS=000
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              -X POST \
              "${{ vars.OAUTH_BASE_URL }}/mcp" || echo "000")
            echo "MCP endpoint HTTP status (attempt $attempt/$MAX_ATTEMPTS): $HTTP_STATUS"
            if [[ "$HTTP_STATUS" != 5* ]] && [[ "$HTTP_STATUS" != "000" ]]; then
              break
            fi
            if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [[ "$HTTP_STATUS" == 5* ]] || [[ "$HTTP_STATUS" == "000" ]]; then
            echo "::error::MCP endpoint returned HTTP $HTTP_STATUS after $MAX_ATTEMPTS attempts — \
          revision $SERVING may be unhealthy; check Cloud Run logs"
            exit 1
          fi
          echo "MCP endpoint smoke test passed: HTTP $HTTP_STATUS ✓"

      # docs/deploy/local.md and compose.yml document
      # ghcr.io/shigechika/jquants-mcp:latest as the self-hosted
      # docker-compose image (streamable-http entrypoint.sh, or entrypoint.sh
      # with ENABLE_DAILY_FETCH) -- unrelated to *which* Cloud Run service is
      # deployed above, but still gated by the same should_deploy condition
      # and still skipped if an earlier step in this job fails (pre-existing
      # sequencing, unchanged by this PR).
      - name: Log in to GHCR
        if: steps.gate.outputs.should_deploy == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: steps.gate.outputs.should_deploy == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha || github.sha }}
