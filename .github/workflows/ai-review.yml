name: AI review

# First-pass AI code review via a self-hosted OpenAI-compatible endpoint
# (Azure AI Foundry v1 API), standing in for GitHub Copilot review while it
# is unavailable — and complementing it later: the prompt steers the model
# toward repository-guidance violations, cross-file consistency and security,
# which is a deliberately different lens from Copilot's generic pass.
#
# Quality controls (the quality-only subset of mcp-stdio's ai-review.yml,
# shigechika/mcp-stdio#354):
#
#   * Reporting bar: the system prompt demands a concrete failing input and
#     the resulting wrong behavior per finding, citing file:line from the
#     diff, and caps output at 3 findings — speculative or borderline
#     findings are told to stay unreported.
#   * Verifier pass: a second, cheap call against the same deployment gives
#     a skeptical KEEP/DROP verdict per finding, and refuted findings are
#     dropped before posting. If the verifier call fails, findings post
#     unverified with a note (advisory degrade).
#
# The per-push machinery around those controls in mcp-stdio (sticky comment,
# findings ledger, delta rounds, docs-only skip) is deliberately NOT ported:
# this workflow reviews each PR once — the trigger below has no synchronize
# — so there is no per-push noise for that machinery to solve.
#
# Advisory only: every failure path soft-fails so this job can never block a
# PR. Skips release-please version bumps (same-repo scoped, mirroring
# copilot-review.yml's gate — a fork controls head.ref, so branch names must
# not dodge review) plus Dependabot bumps — mechanical diffs aren't worth
# review tokens. Unlike copilot-review.yml this uses plain pull_request, NOT
# pull_request_target: _target would run with secrets against an
# attacker-controlled head, the classic pwn-request antipattern. Consequence:
# fork PRs get no secrets and therefore no AI review — accepted.
#
# Nothing from the PR head is read as a file: the diff and description come
# from the API, and repository guidance is fetched at the base revision. The
# job therefore does not check out at all.
#
# Secrets (the endpoint hostname is deliberately kept out of this public
# repo — treat it like a credential):
#   AI_REVIEW_ENDPOINT  resource root, e.g. https://<resource>.services.ai.azure.com
#   AI_REVIEW_API_KEY   API key for that resource
# Optional repository variable:
#   AI_REVIEW_MODEL     deployment name (default: gpt-5.6-sol)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write # post the review comment

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: >-
      ${{ !github.event.pull_request.draft &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release-please--')) &&
          github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - name: Request AI review
        env:
          GH_TOKEN: ${{ github.token }}
          ENDPOINT: ${{ secrets.AI_REVIEW_ENDPOINT }}
          API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          MODEL: ${{ vars.AI_REVIEW_MODEL || 'gpt-5.6-sol' }}
          PR: ${{ github.event.pull_request.number }}
          # gh resolves the target repo from the local git remote; with no
          # checkout there is none, so every `gh pr ...` call below would fail
          # to find the PR. GH_REPO makes the resolution explicit.
          GH_REPO: ${{ github.repository }}
          # Guidance is read at the BASE revision, never the PR head — see the
          # loop below for why.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Via env, not inline ${{ }} in run:, so a crafted title can't
          # inject shell (same hygiene as the other workflows here).
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$ENDPOINT" ] || [ -z "$API_KEY" ]; then
            # Also the fork-PR path: secrets are absent there by design.
            echo "::warning::AI_REVIEW_ENDPOINT / AI_REVIEW_API_KEY not set — skipping AI review"
            exit 0
          fi

          # Secret masking is exact-substring: the registered secret includes
          # the scheme, so a bare-host occurrence (e.g. curl's own error text)
          # would NOT be masked. Register the bare host as an extra mask.
          bare_host=$(printf '%s' "$ENDPOINT" | sed -E 's#^[a-zA-Z]+://##; s#[/:].*$##')
          if [ -n "$bare_host" ]; then echo "::add-mask::$bare_host"; fi

          # Normalize to the resource ROOT: the v1 route lives directly under
          # the host, so an Azure AI Foundry *project* URL
          # (https://host/api/projects/xxx) in the secret must be reduced to
          # scheme+host — the same pitfall the summarizer hit before.
          ENDPOINT=$(printf '%s' "$ENDPOINT" | sed -E 's#^([a-zA-Z]+://[^/]+).*#\1#')

          # The diff goes to a file rather than inline into the prompt block:
          # the verifier pass below reuses it as ground truth.
          gh pr diff "$PR" 2>/dev/null | head -c 100000 > fulldiff.txt || true
          if [ ! -s fulldiff.txt ]; then
            echo "::warning::could not fetch the PR diff (GitHub API error?) — skipping AI review"
            exit 0
          fi

          # The default run shell is bash with errexit+pipefail, so guard the
          # prompt-building calls too — a transient GitHub API error must
          # degrade the prompt, not fail the job (advisory-only contract).
          {
            echo "PR title: $TITLE"
            echo
            echo "PR description:"
            gh pr view "$PR" --json body -q .body 2>/dev/null | head -c 4000 || true
            echo
            # Read guidance from the BASE revision over the API, not from a
            # checked-out working tree. Two reasons, both about the PR head
            # being attacker-controlled on a same-repo branch (where secrets
            # ARE present):
            #
            #   * `[ -f "$f" ]` follows symlinks, so a PR replacing CLAUDE.md
            #     with a link to /proc/self/environ put this step's environment
            #     — API_KEY, GH_TOKEN — into the prompt, and a crafted title
            #     could ask the model to repeat it in its public comment.
            #   * Guidance from the head is guidance the PR can rewrite: the
            #     file telling the model what to enforce must not be editable
            #     by the change being reviewed.
            #
            # What the type filter actually excludes: the Contents API returns
            # type "symlink" only when the target is NOT a normal file in the
            # repository — which is the case that mattered, since a link to
            # /proc/self/environ is dropped. A link to another tracked file
            # comes back as that file's content and is accepted: reading at the
            # base revision means such a link is already merged and reviewed,
            # and its target is repository content either way.
            #
            # A file over 1 MiB comes back with encoding "none" and no content,
            # so it is skipped rather than truncated. Said in the filter rather
            # than left implicit; the largest guidance file here is 22 KB.
            #
            # A PR that legitimately adds guidance sees it applied once merged,
            # which is the intended trade.
            for f in CLAUDE.md AGENTS.md .github/copilot-instructions.md; do
              # `|| true` sits INSIDE the substitution so the captured prefix
              # survives. Under pipefail a head that stops early SIGPIPEs
              # base64, and an outer `|| body=""` would then discard the 8000
              # bytes already read — turning "truncate it" into "guidance
              # silently absent". head -c also keeps the limit in BYTES: a bash
              # substring counts characters, roughly 3x more for CJK guidance.
              body=$(gh api "repos/$GH_REPO/contents/$f?ref=$BASE_SHA" \
                       --jq 'select(.type=="file" and .encoding=="base64") | .content' 2>/dev/null \
                     | tr -d '\n' | base64 -d 2>/dev/null | head -c 8000 || true)
              if [ -n "$body" ]; then
                echo "=== Repository guidance: $f ==="
                printf '%s\n' "$body"
              fi
            done
            echo "=== Unified diff ==="
            cat fulldiff.txt
          } > prompt.txt

          system='You are an advisory reviewer for pull requests in this
          repository. Focus on: real bugs and logic errors introduced by
          the diff, violations of the repository guidance included in the
          prompt, cross-file inconsistencies, and security issues.

          Reporting bar: report a finding only if you can name the concrete
          failing input or state and the resulting wrong behavior, citing
          file and line from the diff. Do NOT report: pre-existing issues on
          lines the diff does not modify; documentation or comment accuracy;
          style or formatting; anything a linter, typechecker or test suite
          already catches; a speculative scenario that requires a
          non-compliant peer or component, unless you name the concrete
          malformed input. Prefer missing a borderline issue over reporting
          a speculative one. Report at most 3 findings, most severe first.

          Output format, exactly and with no code fences. Write in English,
          whatever language the PR description is in: this is a public
          repository and the review is published with it. For each finding:
          ===FINDING F<n>===
          <file>:<line> - <one-line summary>
          <2-4 sentences: the concrete failing input or state and the wrong
          behavior>
          ===END FINDING===
          If nothing clears the bar, write this single line instead of any
          finding block:
          No findings clear the reporting bar.
          Output nothing after the last finding block.'

          jq -n --arg model "$MODEL" --arg system "$system" \
                --rawfile user prompt.txt \
                '{model: $model,
                  messages: [{role: "system", content: $system},
                             {role: "user", content: $user}]}' > payload.json || {
            echo "::warning::failed to build request payload — skipping AI review"
            exit 0
          }

          # stderr is dropped: curl's own error text prints the bare endpoint
          # host, which the add-mask above should catch but belt-and-braces.
          resp=$(curl -fsS -m 300 --retry 2 --retry-delay 5 --retry-all-errors \
                   -H "Authorization: Bearer $API_KEY" \
                   -H "Content-Type: application/json" \
                   -d @payload.json \
                   "${ENDPOINT%/}/openai/v1/chat/completions" 2>/dev/null) || {
            echo "::warning::AI review request failed — skipping"
            exit 0
          }
          review=$(printf '%s' "$resp" | jq -r '.choices[0].message.content // empty' 2>/dev/null) || {
            echo "::warning::unparseable AI review response — skipping"
            exit 0
          }
          if [ -z "$review" ]; then
            echo "::warning::empty AI review response — skipping"
            exit 0
          fi

          # ---------- Parse model output (untrusted) ----------
          printf '%s\n' "$review" > review_body.txt
          ids=$(awk '/^===FINDING /{id=$2; sub(/=+$/, "", id); print id}' review_body.txt || true)

          # ---------- Verifier pass (second, cheap call) ----------
          # A skeptical second opinion on each candidate finding; refuted
          # ones are dropped before posting. Kept deliberately light: a
          # heavier verifier prompt overcorrects and drops real findings.
          VERIFIER_NOTE=""
          DROPPED_IDS=""
          if [ -n "$ids" ]; then
            vsystem='You are a skeptical verifier of candidate code-review findings.
            Judge each candidate against the diff: can it be refuted? Does
            the cited evidence actually support it? Would the concern change
            observed behavior? Output exactly one line per candidate id and
            nothing else, no formatting or bold:
            <id>: KEEP - <short reason>
            <id>: DROP - <short reason>
            DROP only findings you can refute or whose cited evidence does
            not support them; otherwise KEEP. The diff may be truncated: a
            cited hunk being absent from it is NOT grounds to DROP — only
            an affirmative refutation is. Keep each reason under 15
            words.'
            {
              echo "Candidate findings:"
              cat review_body.txt
              echo
              echo "=== Diff (ground truth) ==="
              # The SAME capped diff the reviewer saw (fulldiff.txt is
              # truncated once, at fetch time). A smaller slice here made
              # correct findings citing code beyond it look uncited and get
              # dropped as unsupported.
              cat fulldiff.txt
            } > vprompt.txt
            verdicts=""
            if jq -n --arg model "$MODEL" --arg system "$vsystem" \
                  --rawfile user vprompt.txt \
                  '{model: $model,
                    messages: [{role: "system", content: $system},
                               {role: "user", content: $user}]}' > vpayload.json 2>/dev/null; then
              vresp=$(curl -fsS -m 120 --retry 2 --retry-delay 5 --retry-all-errors \
                        -H "Authorization: Bearer $API_KEY" \
                        -H "Content-Type: application/json" \
                        -d @vpayload.json \
                        "${ENDPOINT%/}/openai/v1/chat/completions" 2>/dev/null || true)
              verdicts=$(printf '%s' "$vresp" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
            fi
            if [ -n "$verdicts" ]; then
              # Tolerant parse: case-insensitive, whitespace-flexible, and
              # alphanumeric-only ids so stray formatting characters cannot
              # smuggle an entry into the drop list. Ids are uppercased so a
              # tolerated lowercase verdict ("f1: drop") still matches in the
              # awk filter below, which compares uppercased ids against it.
              DROPPED_IDS=$(printf '%s\n' "$verdicts" \
                | grep -oiE '^[A-Za-z0-9]+[[:space:]]*:[[:space:]]*DROP' \
                | cut -d: -f1 | tr -d ' \t' \
                | tr '[:lower:]' '[:upper:]' | paste -sd, - || true)
            else
              VERIFIER_NOTE="Verifier pass unavailable — findings above are unverified."
            fi
          fi

          # Keep only finding blocks the verifier did not drop. Ids the
          # verifier invents match no block, so they are inert. Matched in
          # uppercase (DROPPED_IDS is uppercased at collection).
          awk -v list="$DROPPED_IDS" '
            BEGIN { n = split(list, a, ","); for (i = 1; i <= n; i++) if (a[i] != "") drop[a[i]] = 1 }
            /^===FINDING / { id = $2; sub(/=+$/, "", id); inb = 1; skip = (toupper(id) in drop); if (!skip) print; next }
            /^===END FINDING===/ { if (inb && !skip) print; inb = 0; skip = 0; next }
            { if (inb && !skip) print }
          ' review_body.txt > kept.txt || true

          # ---------- Render the visible review body ----------
          if [ -s kept.txt ]; then
            awk '
              /^===FINDING / { id = $2; sub(/=+$/, "", id); printf "**%s** — ", id; next }
              /^===END FINDING===/ { print ""; next }
              { print }
            ' kept.txt > rendered.md || true
          elif [ -n "$ids" ]; then
            echo "All candidate findings were refuted by the verifier pass — no findings." > rendered.md
          elif grep -qi "no findings clear the reporting bar" review_body.txt 2>/dev/null; then
            echo "No findings clear the reporting bar." > rendered.md
          else
            # Unstructured model output: post it as-is rather than discard a
            # possibly useful review (advisory degrade).
            head -c 20000 review_body.txt > rendered.md || true
            VERIFIER_NOTE="Model output was unstructured — posted without verification."
          fi

          {
            echo "### AI review (${MODEL})"
            echo
            cat rendered.md
            echo
            if [ -n "$VERIFIER_NOTE" ]; then
              echo "<sub>${VERIFIER_NOTE}</sub>"
              echo
            fi
            echo "<sub>Advisory review generated by ai-review.yml — verify findings before acting.</sub>"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md \
            || echo "::warning::failed to post AI review comment"
