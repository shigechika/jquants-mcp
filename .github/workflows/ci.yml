name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lint/test only — checkout needs nothing beyond read. Declared explicitly so
# the jobs no longer depend on the repository's default token permissions.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs needs full history for version
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check --exclude _version.py src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs needs full history for version
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev --python ${{ matrix.python-version }}
      - run: uv run pytest -v

  # Separate job (NOT folded into the `test` matrix) so the existing
  # `test (3.x)` check names stay stable for branch protection, while still
  # catching Windows-only breakage (file encoding, paths) at PR time instead
  # of only at release (release.yml).
  #
  # This is a required check, so it pins the newest Python of the Linux matrix
  # (keep "3.14" below equal to the last entry of `test.strategy.matrix`; a
  # matrix cannot read a workflow variable, so the two are bumped together).
  # #627 let it float to the latest stable instead, but a required check that
  # floats blocks every PR whenever a new Python ships before the dependency
  # tree has wheels for it: Python 3.15 arrived with pywin32 311, pydantic-core
  # 2.41 and zstandard 0.25 all lacking cp315 wheels (#633). The version is
  # irrelevant to what this job tests -- encoding and path handling are
  # platform-level -- so pinning loses nothing here.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs needs full history for version
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: py-windows-3.14
      - run: uv python install 3.14
      - run: uv sync --dev --python 3.14
      - run: uv run pytest -v

  # The early warning #627 wanted, kept as a non-blocking job: the latest stable
  # Python on Windows (a bare `uv python install` installs it, and `uv sync`
  # without `--python` then selects it; https://docs.astral.sh/uv/guides/install-python/,
  # astral-sh/uv#21274). It is not a required check and `continue-on-error`
  # keeps a red result from failing the workflow, so a new Python that breaks a
  # dependency shows up here without blocking merges.
  #
  # A dependency that cannot be installed yet (no wheel for the new Python, as
  # with pydantic-core under 3.15) is upstream's to fix, not ours, so it is a
  # warning annotation rather than a red X on every PR. Once the install works,
  # a failing test suite is ours and stays red.
  test-windows-latest:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs needs full history for version
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: py-windows-latest
      - run: uv python install
      - id: sync
        continue-on-error: true
        run: uv sync --dev
      - if: steps.sync.outcome == 'failure'
        run: echo "::warning title=test-windows-latest::Dependencies do not install on the latest Python yet (see the sync step log); tests skipped."
      - if: steps.sync.outcome == 'success'
        run: uv run pytest -v
