version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    # A major mcp SDK release has renamed or removed the server API this
    # package imports (2.0 removed mcp.server.fastmcp; see #626 / #635).
    # Widening the "<N" cap alone then breaks every fresh install, so major
    # SDK bumps are migrated by hand rather than bumped by Dependabot.
    ignore:
      - dependency-name: "mcp"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Python base-image bumps require a coordinated update of both the
    # builder and runtime stages in Dockerfile (see PR #89 postmortem:
    # silently mismatched stages would break Cloud Run at deploy time).
    # CI does not build the Docker image, so Dependabot's "tests green"
    # signal cannot catch this. Handle Python bumps manually.
    ignore:
      - dependency-name: "python"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    labels:
      - dependencies
