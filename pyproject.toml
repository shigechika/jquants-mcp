[project]
name = "jquants-mcp"
version = "0.55.0"
description = "MCP server for retrieving Japanese stock market data via J-Quants API v2"
readme = "README.md"
authors = [{ name = "shige" }]
license = { text = "MIT" }
license-files = ["LICENSE"]
requires-python = ">=3.10"

dependencies = [
    # fastmcp stays a direct dependency for auth.py / settings/ (HTTP-transport
    # OAuth providers + the /settings web UI). Those modules are unreachable
    # from the stdio-only server built by server.py (which now uses the
    # official mcp SDK's FastMCP below) but are kept present, not deleted,
    # until every HTTP-serving deployment migrates off the fastmcp-based
    # OAuth path — see #568.
    "fastmcp>=3.2.1",
    # mcp.server.fastmcp.FastMCP is what server.py and the tools/ modules
    # actually import. fastmcp>=3.2.1 itself constrains this to
    # mcp<2.0,>=1.24.0; pinned explicitly here since it is now a direct
    # runtime dependency, not just a transitive one.
    "mcp>=1.24,<2",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/shigechika/jquants-mcp"
Documentation = "https://github.com/shigechika/jquants-mcp/tree/main/docs"
"Bug Tracker" = "https://github.com/shigechika/jquants-mcp/issues"

[project.optional-dependencies]
cloud-run = [
    "google-cloud-storage>=2.0.0",
    "google-cloud-firestore>=2.0.0",
    # cache.db is published to GCS zstd-compressed; the Cloud Run startup copy
    # and the Pub/Sub reload stream-decompress it (falling back to the
    # uncompressed object when absent). See scripts/gcs_sync.py / server.py.
    "zstandard>=0.21.0",
    # Fronts the stdio-only server over HTTP for the mcp-stdio/serve Cloud
    # Run deployment (entrypoint-stdio.sh). PyPI package; see mcp-stdio#400
    # for the --user-env flag this deployment relies on, and mcp-stdio#404
    # for the --token-store-firestore flag entrypoint-stdio.sh now passes
    # (0.42.0+). The [firestore] extra is declared explicitly even though
    # google-cloud-firestore is already present above for jquants-mcp's own
    # FirestoreUserStore -- it documents the real dependency instead of
    # relying on that coincidence.
    "mcp-stdio[firestore]>=0.42.0",
]
[project.scripts]
jquants-mcp = "jquants_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.22.0",
    "ruff>=0.1.0",
    # Exercises the real zstd round-trip in cache.db compress/decompress tests.
    "zstandard>=0.21.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jquants_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
