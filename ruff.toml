target-version = "py310"
line-length = 100

# Stated rather than inherited. Ruff's DEFAULT rule set is not stable across
# releases — 0.16 widened it (UP, B, SIM, BLE, RUF …) — so a repository
# relying on the default can go red on a ruff upgrade without a line of its own
# code changing. This repository was the last one in the family still doing so.
#
# These four are ruff's historical default, which is exactly what CI has been
# enforcing all along (the lockfile resolves ruff 0.15, whose default set these
# are). Writing them down changes no verdict today; it stops the verdict from
# changing on its own when the pin moves.

[lint]
select = ["E4", "E7", "E9", "F"]
