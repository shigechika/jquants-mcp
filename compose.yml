# Local Docker Compose deployment for jquants-mcp.
# Starts an MCP server on http://localhost:8080/mcp — no TLS, GCS, or OAuth.
#
# Quick start (build from this checkout):
#   echo 'JQUANTS_API_KEY=xxx' > .env
#   docker compose up -d --build
#   # → point your MCP client at http://localhost:8080/mcp
#
# `docker compose` reads .env automatically, and .env is gitignored. Passing
# the key on the command line works too but leaves it in your shell history.
#
# Building from the checkout is the default because it always matches the code
# you have. To use the published image instead, drop `--build`; compose then
# pulls ghcr.io/shigechika/jquants-mcp:latest.
#
# With bearer token auth — required before exposing this beyond localhost,
# e.g. by changing the port mapping below to "0.0.0.0:8080:8080":
#   MCP_STDIO_SERVE_TOKEN=yyy docker compose up -d --build
#
# With a scheduled cache refresh (weekdays 17:30 JST):
#   ENABLE_DAILY_FETCH=true docker compose up -d --build
#
# The cache starts empty and fills as tools are called; uncached data is
# fetched from the live J-Quants API, so it works from the first request.

services:
  jquants-mcp:
    image: ghcr.io/shigechika/jquants-mcp:latest
    build: .
    ports:
      # Host-side 127.0.0.1 is the only thing restricting exposure — the
      # server itself requires no authentication unless MCP_STDIO_SERVE_TOKEN
      # is set. Do not widen this without setting that token.
      - "127.0.0.1:8080:8080"
    environment:
      JQUANTS_API_KEY: ${JQUANTS_API_KEY}
      # Read directly by `mcp-stdio serve`. Unset = no authentication.
      MCP_STDIO_SERVE_TOKEN: ${MCP_STDIO_SERVE_TOKEN:-}
      # Override the Cloud Run default (/tmp) so the cache persists in the volume.
      JQUANTS_CACHE_DIR: /home/appuser/.cache/jquants-mcp
      PORT: "8080"
      # Set ENABLE_DAILY_FETCH=true to run daily_fetch.py on weekdays at 17:30 JST.
      ENABLE_DAILY_FETCH: ${ENABLE_DAILY_FETCH:-}
    volumes:
      - cache:/home/appuser/.cache/jquants-mcp
    restart: unless-stopped

volumes:
  cache:
